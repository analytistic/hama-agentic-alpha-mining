[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hama-agentic-alpha-mining"
version = "0.1.0"
description = "Harness-Augmented Agentic Alpha Mining"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "httpx>=0.28.1",
  "numpy>=1.26",
  "pandas>=2.0",
  "python-dotenv>=1.1.0",
  "pyqlib>=0.9.7",
]

[project.optional-dependencies]
attribution = ["accelerate>=1.0", "torch>=2.4", "transformers>=4.51"]
test = ["pytest>=8"]

[project.scripts]
hama = "hama.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
